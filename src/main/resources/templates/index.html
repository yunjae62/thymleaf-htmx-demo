<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(title='홈')}"></head>
<body>

<header th:replace="~{layout/base :: header}"></header>

<main>
  Hello world!

  <button hx-swap="innerHTML" hx-target="#result" th:hx-post="@{/hello}">클릭</button>

  </div>

<footer th:replace="~{layout/base :: footer}"></footer>

</body>
</html>
