<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(title=${post.title})}"></head>
<body>

<header th:replace="~{layout/base :: header}"></header>

<main>
  <h1 th:text="${post.title}">제목</h1>
  <p>
    <span th:text="${post.author.nickname}">작성자</span>
    ·
    <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">작성일</span>
  </p>
  <div style="white-space: pre-wrap" th:text="${post.content}">내용</div>

  <p><a th:href="@{/posts}">목록으로</a></p>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>

</body>
</html>
